<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>longinfer 控制台</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--border:#2a2f3d;--text:#e6e8ef;--muted:#8b90a0;--accent:#e60012;--ok:#3fb950;--code:#0d1117}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
header h1{font-size:16px;margin:0;letter-spacing:.5px}
.badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
textarea{width:100%;background:var(--code);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:inherit;resize:vertical;min-height:90px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:600}
button:hover{opacity:.9}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
pre{background:var(--code);border:1px solid var(--border);border-radius:6px;padding:12px;overflow:auto;max-height:300px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
label{color:var(--muted);font-size:12px}
input{background:var(--code);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
.status{font-size:12px;color:var(--ok)}
</style>
</head>
<body>
<header><h1>longinfer 控制台</h1><span class="badge">MoE · W4A4 · 长程智能体</span><span class="status" id="health">连接中...</span></header>
<main>
  <div class="card">
    <h2>对话推理</h2>
    <textarea id="prompt" placeholder="输入 prompt，例如：解释 MoE 稀疏路由的原理"></textarea>
    <div class="row"><button onclick="doChat()">发送</button></div>
    <pre id="chat-out">（结果将显示在此）</pre>
  </div>
  <div class="card">
    <h2>长程智能体</h2>
    <div class="row"><label>目标</label><input id="goal" value="修复 checkout 页崩溃" style="flex:1"></div>
    <div class="row"><button onclick="doAgent()">运行智能体</button></div>
    <pre id="agent-out">（轨迹将显示在此）</pre>
  </div>
  <div class="card">
    <h2>视觉 RVQ 离散化</h2>
    <div class="row"><label>图像路径（留空=合成图）</label><input id="img" value="" style="flex:1"></div>
    <div class="row"><button onclick="doVision()">分词</button></div>
    <pre id="vision-out"></pre>
  </div>
  <div class="card">
    <h2>分布式部署计划</h2>
    <div class="row"><button onclick="doCluster()">生成计划</button></div>
    <pre id="cluster-out"></pre>
  </div>
</main>
<script>
const API = location.origin;
async function j(path, body){
  const opt = body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {};
  const r = await fetch(API+path, opt);
  return r.json();
}
(async function health(){ try{ const h = await j("/health"); document.getElementById("health").textContent = `服务正常 · ${h.provider}/${h.model}`; }catch(e){ document.getElementById("health").textContent = "无法连接"; } })();
function set(id, v){ document.getElementById(id).textContent = JSON.stringify(v, null, 2); }
async function doChat(){ set("chat-out", await j("/v1/chat", {prompt: document.getElementById("prompt").value})); }
async function doAgent(){ set("agent-out", await j("/v1/agent/run", {goal: document.getElementById("goal").value})); }
async function doVision(){ set("vision-out", await j("/v1/vision/tokenize", {image_path: document.getElementById("img").value})); }
async function doCluster(){ set("cluster-out", await j("/v1/cluster/plan")); }
</script>
</body>
</html>
