apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longinfer
  namespace: longinfer
spec:
  rules:
    - host: longinfer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longinfer
                port:
                  number: 8000
